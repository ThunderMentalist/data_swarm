timezone: Europe/London
llm:
  provider: openai
  defaults:
    model: gpt-5.4
    reasoning_effort: medium
    verbosity: medium
    max_output_tokens: null
  profiles:
    triage.concierge:
      model: gpt-5.4
      reasoning_effort: medium
      verbosity: medium
    triage.critic:
      model: gpt-5.4
      reasoning_effort: high
      verbosity: low
    planner.concierge:
      model: gpt-5.4
      reasoning_effort: high
      verbosity: medium
    planner.critic:
      model: gpt-5.4
      reasoning_effort: high
      verbosity: low
    stakeholder.concierge:
      model: gpt-5.4
      reasoning_effort: medium
      verbosity: medium
    stakeholder.critic:
      model: gpt-5.4
      reasoning_effort: medium
      verbosity: low
    navigation.concierge:
      model: gpt-5.4
      reasoning_effort: medium
      verbosity: medium
    navigation.critic:
      model: gpt-5.4
      reasoning_effort: high
      verbosity: low
    comms.concierge:
      model: gpt-5.4
      reasoning_effort: low
      verbosity: medium
    comms.critic:
      model: gpt-5.4
      reasoning_effort: medium
      verbosity: low
    reaction.concierge:
      model: gpt-5.4
      reasoning_effort: medium
      verbosity: medium
    readiness.evaluator:
      model: gpt-5.4
      reasoning_effort: high
      verbosity: low
    meridian.codegen:
      model: gpt-5.4
      reasoning_effort: high
      verbosity: medium
    meridian.debugger:
      model: gpt-5.4
      reasoning_effort: high
      verbosity: medium
triage:
  default_sensitivity: internal
  risk_flags:
    - timeline
    - dependency
    - stakeholder_alignment
hitl:
  clarification_required: true
  comms_review_required: true
  patch_approval_required: true
  approve_after_test_failure: true
comms:
  default_style: friendly_diplomatic
  leadership_style: formal_concise
  political_two_variant: true
privacy:
  persist_identifiers: false
  require_role_mapping: true
  default_persona_token_format: "JD | Role | Org | Region"
run_mode: INITIAL_USING
attachment_ingest:
  enabled: true
  max_chars_per_file: 20000
  max_files: 25
paths: {}
meridian_aux:
  max_files: 25
  max_chars: 60000
  max_debug_iterations: 3
logging:
  level: INFO
safety:
  never_write_outside_repo: true
